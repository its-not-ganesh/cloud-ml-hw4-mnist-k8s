apiVersion: apps/v1
kind: Deployment
metadata:
  name: mnist-inference
  namespace: mnist-hw4
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: mnist-inference}
  template:
    metadata:
      labels: {app: mnist-inference}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: inference
          image: ghcr.io/its-not-ganesh/cloud-ml-hw4-mnist-k8s-inference:main
          ports: [{containerPort: 8000}]
          resources:
            requests: {cpu: 250m, memory: 384Mi}
            limits: {cpu: "1", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          startupProbe:
            httpGet: {path: /readyz, port: 8000}
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet: {path: /readyz, port: 8000}
            periodSeconds: 3
          livenessProbe:
            httpGet: {path: /healthz, port: 8000}
            periodSeconds: 10
          volumeMounts:
            - {name: model, mountPath: /data, readOnly: true}
      volumes:
        - name: model
          persistentVolumeClaim: {claimName: mnist-model, readOnly: true}
