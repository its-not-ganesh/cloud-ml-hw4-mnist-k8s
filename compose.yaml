services:
  train:
    platform: linux/amd64
    image: mnist-hw4-train:local
    build:
      context: .
      dockerfile: docker/Dockerfile.train
    volumes:
      - ./artifacts:/data
    cpus: 2
    mem_limit: 2g
  inference:
    platform: linux/amd64
    image: mnist-hw4-inference:local
    build:
      context: .
      dockerfile: docker/Dockerfile.inference
    depends_on:
      train:
        condition: service_completed_successfully
    volumes:
      - ./artifacts:/data:ro
    ports:
      - "127.0.0.1:8000:8000"
    cpus: 1
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz')"]
      interval: 10s
      timeout: 3s
      retries: 6
